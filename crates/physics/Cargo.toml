[package]
name = "jarambit-physics"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jarambit-phenotype = { path = "../phenotype" }
jarambit-genotype = { path = "../genotype" }
spade = "2.15"
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "sparse", "sparse-linalg"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "t1_plate"
harness = false
