name: render-marketing-smoke

on:
  pull_request:
    paths:
      - 'ops/render/marketing/**'
      - 'ops/render/pro/**'
      - '.github/workflows/render-marketing-smoke.yml'
  push:
    branches: [main, 'render/**']
    paths:
      - 'ops/render/marketing/**'
      - 'ops/render/pro/**'
      - '.github/workflows/render-marketing-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: marketing render smoke
    runs-on: [self-hosted, linux, x64, jarambit]  # jarambit-xbabe2/3 carry ffmpeg (zscale/x264/x265/webp) + pinned Blender 4.2.23 in ~/opt; the shared lan-ci pool has neither
    # The real memcap/encoder/Blender tests take ~5 min on xbabe2 and ~8.5 min on a
    # loaded xbabe3 (run 38484376326 was cancelled at 8 min while passing).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: required tools fail instead of skip
        run: python3 ops/render/marketing/pipeline.py doctor --require ffmpeg,zscale,libx264,libx265,libwebp,blender
      - name: user systemd bus for memcap (hard 32G, no swap)
        run: |
          set -euo pipefail
          # The runner is a system service, so it inherits no login session and
          # systemd-run --user fails with "Failed to connect to bus: No medium found".
          # The runner user has linger enabled; point at its persistent user manager.
          # Fail closed: no bus, no memcap, no 32G/no-swap scope -> the job fails.
          uid="$(id -u)"
          rt="/run/user/${uid}"
          if [ ! -S "${rt}/bus" ]; then
            echo "required user systemd bus missing: ${rt}/bus (loginctl enable-linger $(id -un)). Not skipped."
            exit 1
          fi
          echo "XDG_RUNTIME_DIR=${rt}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${rt}/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="${rt}" DBUS_SESSION_BUS_ADDRESS="unix:path=${rt}/bus"
          cap="${HOME}/bin/memcap"
          if [ ! -x "$cap" ]; then
            echo "required tool missing: ${cap}. Not skipped."
            exit 1
          fi
          limits="$("$cap" 32G -- sh -c 'cg=$(cut -d: -f3 /proc/self/cgroup); echo "$(cat /sys/fs/cgroup${cg}/memory.max) $(cat /sys/fs/cgroup${cg}/memory.swap.max)"')"
          echo "memcap scope limits: ${limits}"
          if [ "$limits" != "34359738368 0" ]; then
            echo "memcap scope is not hard 32G/no-swap (got: ${limits}). Not skipped."
            exit 1
          fi
      - name: pytest
        env:
          # Same native math pools as local validation; a 128-thread BLAS pool per
          # test process oversubscribes the shared runner hosts.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          # CAD ingest tests import OCP. System Python on the jarambit runners does not
          # have it; the pinned interpreter is requirements-cad.txt. Missing OCP fails closed.
          PY="${HOME}/jarambit_render/venv-cad/bin/python"
          if [ ! -x "$PY" ]; then
            echo "required tool missing: ${PY} (OCP). Not skipped."
            exit 1
          fi
          "$PY" -c 'import OCP'
          "$PY" -m pytest -q ops/render/marketing/tests ops/render/pro/tests
