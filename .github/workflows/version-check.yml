name: version-check

on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: VERSION == tag == WHITEPAPER header
    runs-on: [self-hosted, linux, x64, jarambit]  # dedicated jarambit-xbabe2 / jarambit-xbabe3 runners (PR-0.30.0c); the shared neverhuman-lan pool queued for capacity
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 ops/ci/version_check.py
      - run: python3 -c "import sys; sys.path.insert(0,'metrics'); import global_metric as g; v,_=g.global_G(dict(solid_tip_sf_nodal_max=1.5,spg=4.0,aes_score=0.6,mass_g=80,seq_ratio=0.9)); assert abs(v-0.9675)<1e-9, v; print('G smoke ok', v)"
      - name: G1 completeness contract tests (PR-0.28.1)
        run: python3 -m unittest discover -s metrics/tests -t . -v
      - name: Claim checker — scoped PASS, RS verdict blocks, default evaluator (PR-0.28.2)
        run: python3 ops/ci/check_claims.py
      - name: STATUS.md is generated and current (PR-0.28.5)
        run: python3 ops/ci/gen_status.py --check
      - name: Media manifests match outputs and inputs (ops/render)
        run: python3 ops/ci/verify_media.py
      - name: README generated blocks are current (issue #35)
        run: python3 ops/ci/gen_readme.py --check
      - name: Figure manifests match inputs (PR-0.29.4)
        run: python3 ops/ci/verify_figures.py
      - name: Figure helper tests (PR-0.29.4)
        run: python3 -m unittest discover -s ops/ci/tests -v
      - name: Solid tip submodel evidence (PR-0.30.1; slow re-run is opt-in)
        run: python3 -m unittest discover -s fem_solid/tests -v
