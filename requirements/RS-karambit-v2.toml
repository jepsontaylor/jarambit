# RS-karambit-v2 — PR-0.31.3 (v0.31). Author: Jepson Taylor.
# Supersedes RS-karambit-v1 for promotion once a design can meet it; v1 stays the search/screen set (records keep
# naming the set they were judged against). Values are checked against the Rust constants
# (crates/crescent/src/fem.rs, test rs_karambit_v2_matches_code).
# Scope: structural utility loads only. Every case below is a load the PART must carry without permanent set
# (first yield, joint thin+hot knockdowns, 828 MPa screening yield) or a geometric/handling requirement.
# No tissue-damage, penetration or strike-effect objectives exist in this set or anywhere in jarambit.

id = "RS-karambit-v2"
version = 2
status = "v0.32.0i: tip_inplane RECORD-ONLY + Gate S (Jepson 2026-10-13 04:13 MT); v0.31: published; human_max group is new (Jepson 2026-10-12); mass SOFT (Jepson decision overrides the roadmap's 'mass<=80 hard'); seq >= 1.2 HARD"

[constants]
inherits = "RS-karambit-v1"      # every v1 constant still applies (ring ID, blade limit, floors, twist floor, solid tip)
seq_target = 1.2                 # HARD
mass_target_g = 80.0             # SOFT: G penalty / ranking target
mass_stretch_g = 70.0            # SOFT

[human_max]
# Human-maximum structural load cases (static, first-yield SF >= 1 = no permanent set).
twist_nmm = 16200.0              # 16.2 N*m tip torque about the ring->tip chord (3D-corrected, as the 1.82 N*m floor)
tip_inplane_n = 1000.0           # in-plane tip load, worst of chord-normal and chord-axial, ring held. RECORD-ONLY since 2026-10-13 (owner): solved + reported, not gating
spine_n = 3427.0                 # in-plane load distributed on the spine edge toward the sharpened edge, ring held
ringback_daf = 2.0               # L6 ring-back impact as a static equivalent: DAF 2 (suddenly applied) x ring pull
ringback_n = 3000.0              # PROVISIONAL (owner decision 2026-10-12): no measured ring-back impact data yet; static equivalent = DAF 2 (suddenly applied load) x 1500 N ring pull, +x on the outer ring back, grip band seated. Replace when impact test data exist.
ring_bearing_w_min_mm = 10.0     # finger-bearing width (bore length along the finger axis) >= 10 mm
ring_edge_r_min_mm = 1.5         # bore edge radius >= 1.5 mm on both faces (B-rep / export spec; needs bearing >= 2 r)

[fatigue]
# L7: Marin-corrected endurance limit + modified Goodman (Shigley 10e). Cyclic hiker lateral 0..180 N (R = 0), 1e7 cycles.
uts_mpa = 895.0                  # Ti-6Al-4V annealed minimum
se_prime_ratio = 0.5
ka = "4.51 * Sut^-0.265 (machined)"
kb = "1.24 * t^-0.107, t = joint thickness, capped at 1"
ke = 0.814                       # 99 % reliability
cyclic_lateral_n = 180.0
sf_min = 1.0

[calibration]
# T1 (search) -> T2 (certification) factors on 40 fixed_1k designs: docs/calibration/t1_t2.md.
sigma_max = 0.07
source = "docs/calibration/t1_t2.json"

[groups.screen]
criteria = ["RS-karambit-v1.screen"]

[groups.human_max]
criteria = ["hm_twist_sf >= 1", "hm_spine_sf >= 1", "hm_ringback_sf >= 1", "ring_bearing_w_mm >= 10", "ring_edge_r_mm >= 1.5"]
record_field = "rs_v2_human_max_pass"
record_only = ["hm_tip_inplane_sf"]   # owner decision Jepson 2026-10-13 04:13 MT

[gate_s]
# SHARPNESS GATE S, owner hard requirement (Jepson 2026-10-13). Measured on the sharpened B-rep (hiking-karambit
# analysis/w79/sharpness_check.py); mass and every FEM case are taken on the sharpened solid.
apex_max_mm = 0.20               # S1: edge apex (thickness extrapolated to the plan boundary) on every cutting edge
half_angle_max_deg = 25.0        # S3: edge half-angle over the first 0.4 mm (blocks obtuse-wedge apexes)
tip_t025_max_mm = 0.30           # S2: point section thickness 0.25 mm behind the point
tip_t1_max_mm = 0.60             # S2: at 1 mm
tip_t2_max_mm = 1.00             # S2: at 2 mm; t(a) monotonic over the last 10 mm
tip_taper_min_mm = 5.0           # S2: taper length (first a with t >= 0.95 core) >= 5 mm
note = "the extreme point may yield or chip in structural overload (accepted); a dull edge or blunt point is not"

[groups.gate_s]
criteria = ["edge_t <= 0.20", "ea_in <= 25", "ea_sp <= 25", "B-rep S2 tip point (unverified until bound)"]

[groups.fatigue]
criteria = ["fat_sf >= 1"]

[groups.promotion]
criteria = ["RS-karambit-v1.promotion", "seq_ratio >= 1.2 (HARD)", "human_max", "fatigue", "gate_s"]
soft = ["mass_target_g (G penalty, not a gate)", "mass_stretch_g"]
note = "nothing is ever auto-promoted; human aesthetic sign-off still required"
